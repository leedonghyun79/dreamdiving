[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://player.vimeo.com https://*.vimeocdn.com; frame-src 'self' https://player.vimeo.com https://vimeo.com https://*.vimeo.com; img-src 'self' data: blob: https://vumbnail.com https://*.vimeocdn.com https://i.vimeocdn.com; media-src 'self' blob: https://vimeo.com https://*.vimeo.com https://*.vimeocdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://vimeo.com https://*.vimeo.com https://api.vimeo.com https://*.vimeocdn.com https://fresnel.vimeocdn.com https://skyfire.vimeocdn.com https://av.vimeo.com;"
